<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>QRSync - 接收端</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="receiver.css">
</head>
<body>
    <nav>
        <div class="nav-content">
            <a href="../index.html" class="logo">
                <div class="logo-icon">
                    <img src="../icon/QRSync_icon.png" alt="Logo" width="100%" height="100%">
                </div>
                QRSync
            </a>
            <div class="nav-links">
                <a href="../sender/index.html">⬅️ 发送端</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>接收文件</h1>
            <p>扫描二维码序列，自动重组文件</p>
        </div>

        <!-- 扫描区域 -->
        <div class="card scanner-container">
            <div class="card-title"><div class="icon">📷</div>扫描二维码</div>

            <!-- 模式切换 -->
            <div class="mode-tabs">
                <button class="mode-btn active" data-mode="camera" onclick="switchMode('camera')">📷 相机扫描</button>
                <button class="mode-btn" data-mode="virtual" onclick="switchMode('virtual')">🖼️ 图片识别</button>
            </div>

            <!-- 相机模式 -->
            <div id="camera-section" class="active">
                <div class="camera-controls">
                    <div class="camera-select-row">
                        <select id="camera-select"><option value="">请选择摄像头...</option></select>
                        <select id="resolution-select">
                            <option value="auto">自动</option>
                            <option value="720">720p (HD)</option>
                            <option value="1080">1080p (FHD)</option>
                            <option value="1440">2K (QHD)</option>
                            <option value="2160">4K (UHD)</option>
                        </select>
                    </div>
                    <div class="resolution-actual" id="resolution-actual"></div>
                    <button id="btn-start" class="btn btn-primary" style="width:100%" onclick="toggleCamera()">
                        <span id="scan-btn-text">🚀 开始扫描</span>
                    </button>
                </div>

                <div id="scan-section-wrapper" class="scan-section-wrapper">
                    <div class="scan-window" id="scan-window">
                        <button class="scan-close-btn" onclick="stopCamera()">×</button>
                        <div class="video-container">
                            <video id="video" playsinline></video>
                            <div class="scan-overlay">
                                <div class="scan-frame">
                                    <div class="corner tl"></div>
                                    <div class="corner tr"></div>
                                    <div class="corner bl"></div>
                                    <div class="corner br"></div>
                                    <div class="scan-line"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="scan-tips">
                        <p>请将二维码对准扫描框内</p>
                        <p>先扫描数据二维码，最后扫描文件名二维码</p>
                    </div>
                </div>

                <div id="camera-status" class="status-message show status-info">等待扫描第一个二维码...</div>
            </div>

            <!-- 虚拟模式 -->
            <div id="virtual-section">
                <div class="upload-zone"
                     onclick="document.getElementById('file-input').click()"
                     ondrop="handleDrop(event)"
                     ondragover="handleDragOver(event)"
                     ondragleave="handleDragLeave(event)">
                    <h3>📁 点击或拖拽图片到此处</h3>
                    <p style="font-size:13px;color:var(--text-secondary);margin-top:8px">
                        也可直接 <kbd class="kbd-cmd">⌘</kbd>+V 粘贴
                    </p>
                </div>
                <input type="file" id="file-input" accept="image/*" multiple style="display:none"
                       onchange="addToQueue([...this.files])">

                <div class="queue-grid" id="queue-grid"></div>

                <div id="preview-container" class="preview-container" style="display:none">
                    <canvas id="preview-canvas"></canvas>
                </div>

                <div class="btn-group" style="margin-top:12px">
                    <button class="btn btn-primary" id="btn-scan" onclick="scanCurrent()">🔍 识别</button>
                    <button class="btn btn-secondary" onclick="scanAllQueued()">⚡ 全部识别</button>
                </div>
            </div>
        </div>

        <!-- 接收进度 -->
        <div class="card">
            <div class="card-title"><div class="icon">📊</div>接收进度</div>

            <div class="progress-stats">
                <div class="stat-item">
                    <div class="stat-value" id="received-count">0</div>
                    <div class="stat-label">已接收</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="total-count">?</div>
                    <div class="stat-label">总分片</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="missing-count">?</div>
                    <div class="stat-label">缺失</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="progress-pct">--</div>
                    <div class="stat-label">完成率</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill-recv" style="width:0%"></div>
            </div>

            <div id="fingerprint-display" class="fingerprint-display" style="display:none">
                <div class="fp-label">文件指纹</div>
                <div class="fp-value" id="fingerprint-value">-</div>
            </div>

            <div id="filename-display" style="display:none;margin-top:12px;font-size:14px;color:var(--text-secondary);text-align:center">
                文件名：<span style="color:var(--text-primary);font-weight:500"></span>
            </div>

            <div class="missing-chunks" id="missing-list"></div>
        </div>

        <!-- 操作 -->
        <div class="card">
            <div class="card-title"><div class="icon">⬇️</div>下载文件</div>
            <div class="action-buttons">
                <button class="btn btn-success" id="btn-reassemble" disabled onclick="reassembleFile()">
                    ⬇️ 重组并下载
                </button>
                <button class="btn btn-secondary" onclick="clearAllData()">
                    🗑️ 清除数据
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 依赖库（顺序重要） -->
    <script src="../js/pako.min.js"></script>
    <script src="../js/localforage.min.js"></script>
    <script src="../js/jsQR.js"></script>

    <!-- zxing-wasm：wasm binary 以 base64 内嵌，绕过 file:// CORS 限制 -->
    <script src="../js/zxing_reader_wasm_b64.js"></script>
    <script>
        // 手写循环比 Uint8Array.from(binary, c=>c.charCodeAt(0)) 快 ~12x（5ms vs 60ms）
        var _b64decoded = atob(ZXingWasmBase64);
        ZXingWasmBase64 = null; // base64 字符串已不再需要，立即释放（节省 ~2.8MB）
        var _wasmArr = new Uint8Array(_b64decoded.length);
        for (var _i = 0; _i < _b64decoded.length; _i++) _wasmArr[_i] = _b64decoded.charCodeAt(_i);
        _b64decoded = null;
        var _wasmBinary = _wasmArr.buffer;
        _wasmArr = null;
    </script>
    <script src="../js/zxing-wasm-reader.js"></script>
    <script>
        ZXingWASM.setZXingModuleOverrides({ wasmBinary: _wasmBinary });
        _wasmBinary = null;
        // 预热 wasm，标记就绪状态
        ZXingWASM.readBarcodesFromImageData(
            { data: new Uint8ClampedArray(4), width: 1, height: 1 },
            { formats: ['QRCode'] }
        ).then(() => {
            ZXingWASM._wasmReady = true;
            console.log('[zxing-wasm] ✅ 已就绪');
        }).catch(e => {
            console.warn('[zxing-wasm] ⚠️ 初始化失败，将使用 jsQR 兜底:', e.message);
        });
    </script>

    <!-- 共享工具函数 -->
    <script src="../shared/utils.js"></script>
    <!-- 接收端逻辑 -->
    <script src="receiver.js"></script>
</body>
</html>
